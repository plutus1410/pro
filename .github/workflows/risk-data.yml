name: Build stress test data

# The data behind the Stress test page (data/risk/): 20+ years of daily returns for every Nifty 500 stock, the
# market, sector indices, USD/INR and crude. Runs every weekday evening after the close (about 10–20 minutes).
# First time: Actions → "Build stress test data" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N companies (blank = all). Use 20 for a quick test."
        required: false
        default: ""
  schedule:
    - cron: "40 12 * * 1-5"   # 18:10 IST on weekdays, after the screener's price refresh

permissions:
  contents: write

concurrency:
  group: risk-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /js/config.js
            /data/screen/
            /data/risk/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          LIMIT: ${{ inputs.limit }}
        run: python scripts/build_risk.py ${LIMIT:+--limit $LIMIT}

      - name: Commit
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "plutus-report-bot"
          git config user.email "plutus-report-bot@users.noreply.github.com"
          git add --sparse data/risk
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "risk: update stress test data"
          for i in $(seq 1 10); do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $(( RANDOM % 15 + 5 ))
          done
          exit 1

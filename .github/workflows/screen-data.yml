name: Build screener data

# The data behind the Screen page (data/screen/universe.json): key numbers for every Nifty 500 company.
#   • weekly (Saturday night): every company's screener.in page is read again — fundamentals, shareholding, growth
#   • daily after market close (Mon–Fri): prices, market cap and every price-based ratio are refreshed from Yahoo
#   • first time: Actions → "Build screener data" → Run workflow → mode "full" (about 30–60 minutes)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = everything (weekly) · prices = prices and price ratios only (daily)"
        required: false
        default: full
        type: choice
        options: [full, prices]
  schedule:
    - cron: "30 20 * * 6"     # Sunday 02:00 IST — full rebuild
    - cron: "0 12 * * 1-5"    # 17:30 IST on weekdays — prices

permissions:
  contents: write

concurrency:
  group: screen-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /js/config.js
            /data/screen/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          MODE: ${{ inputs.mode || (github.event.schedule == '30 20 * * 6' && 'full' || 'prices') }}
        run: python scripts/build_screen.py --$MODE

      - name: Commit
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "plutus-report-bot"
          git config user.email "plutus-report-bot@users.noreply.github.com"
          git add --sparse data/screen
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "screen: update data"
          for i in $(seq 1 10); do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $(( RANDOM % 15 + 5 ))
          done
          exit 1
